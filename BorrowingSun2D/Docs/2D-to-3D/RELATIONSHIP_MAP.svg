      <text x="89" y="964" fill="#17685E" font-size="17" font-weight="750">R · RESET</text>
      <text x="192" y="964" fill="#435D55" font-size="17">清除光路、雨水、配重、奖励和路线；共用实体同步入口，货车回轨头，玩家回入口并直接继续游玩。</text>
