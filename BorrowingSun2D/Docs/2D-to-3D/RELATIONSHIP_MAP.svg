      <text x="90" y="287" fill="#654BA4" font-size="14" font-weight="700" letter-spacing="1.2">READ-ONLY VIEW</text>
      <text x="90" y="322" font-size="29" font-weight="730">TowerView</text>
      <text x="90" y="359" fill="#43534F" font-size="19">读塔、实体几何与货运状态</text>
      <text x="90" y="389" fill="#43534F" font-size="19">按同一份 LightPath2D 绘制光段</text>
    </g>
    <g id="tower-slice">
