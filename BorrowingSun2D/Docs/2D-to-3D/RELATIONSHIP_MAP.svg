      </g>

      <text x="89" y="1028" fill="#17685E" font-size="17" font-weight="750">光线路径</text>
      <text x="193" y="1028" fill="#234E45" font-size="19" font-weight="650">太阳 → 北庭采日镜 → 中央塔镜 → 东岸接光盘</text>
