      <g fill="#43534F" font-size="17">
        <text x="107" y="1232">同一份雨水 · 蓄水 6，等量转入配重</text>
        <text x="107" y="1260">高位东向停稳 · 每秒转 1，配重需求 4</text>
        <text x="573" y="1232">ReceiverLit 连续 1.5 秒后装上一箱水果</text>
        <text x="573" y="1260">纯 C# 持有货运阶段、行程进度与交付计数</text>
        <text x="1039" y="1232">按 TravelProgress 推动实体货车并带人</text>
        <text x="1039" y="1260">Godot 适配层查询车上与交付点的位置</text>
      </g>

      <text x="89" y="1315" fill="#17685E" font-size="17" font-weight="750">货运阶段</text>
      <text x="193" y="1315" fill="#234E45" font-size="18" font-weight="650">WaitingForLight → Loading → Ready → Travelling → Arrived → Delivered</text>
      <rect x="89" y="1330" width="1340" height="34" rx="7" fill="#FFF3D9"/>
      <text x="105" y="1353" fill="#855109" font-size="17">待发 · 玩家站在车上，塔东向停稳，水果已装，实时接光，配重满 4/4。失光暂停转水并阻止发车，已转水量和高位保留。</text>
      <rect x="89" y="1372" width="1340" height="34" rx="7" fill="#E4F3EE"/>
      <text x="105" y="1395" fill="#17685E" font-size="17">发车后 · 即使失光，货车仍按时间沿实体货轨运行。抵达后走到交付标记处按 G，DeliveredCount 记为 1。</text>
    </g>

