        <text x="956" y="905">货运规则与 G</text>
        <text x="1152" y="905">同步实体货车</text>
        <text x="1347" y="905">玩家与路线</text>
      </g>
      <g fill="#435D55" font-size="13" text-anchor="middle">
        <text x="172" y="924">ReadCommands</text>
        <text x="368" y="924">mechanism.Tick</text>
        <text x="564" y="924">Rig.Synchronize</text>
        <text x="760" y="924">Optics.Tick</text>
        <text x="956" y="924">cargo.Tick → G</text>
        <text x="1152" y="924">CargoTrack.Synchronize</text>
        <text x="1347" y="924">Step → TrackPlayer</text>
