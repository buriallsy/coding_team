<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1790" viewBox="0 0 1520 1790" role="img" aria-labelledby="map-title map-description">
  <title id="map-title">Borrowing Sun / Relationship Map · 借晴对象关系图</title>
  <desc id="map-description">Round 04 acceptance candidate. TowerSlice owns Intro, Playing and Finished screen state and presents it through TowerSessionOverlay. The overlay reports acceptance through an event. Replay uses the same reset as the R key and returns to Playing. TowerSlice also coordinates the tower, the route, the player, optics, cargo rules, and physical cargo track. The pure optics solver reports relay hit and receiver light as distinct results. CargoJourney uses sustained receiver light to earn one fruit crate. TowerMechanism transfers the same stored rainwater into the counterweight while the tower remains locked. A rider can launch while the dock, fruit, receiver and counterweight are ready. After launch, the physical carrier follows time-based progress. A separate terminal action confirms one delivery. Reset restores the tower, optics, cargo, and player.</desc>
  <rect width="1520" height="1790" fill="#F0F6F3"/>
  <rect x="30" y="26" width="1460" height="1738" rx="22" fill="#FFFFFF" stroke="#CADBD5"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" fill="#17332E">
