      <text x="535" y="279" fill="#17685E" font-size="15" font-weight="740" letter-spacing="1.2">GODOT FRAME ORCHESTRATION</text>
      <text x="534" y="326" font-size="41" font-weight="760">TowerSlice</text>
      <text x="535" y="365" fill="#2D5148" font-size="20">分发装置指令与 G 交互，协调物理帧</text>
      <text x="535" y="393" fill="#2D5148" font-size="20">同步光路、货运、路线与会话状态</text>
      <text x="535" y="423" fill="#855109" font-size="16" font-weight="650">has-a · CargoJourney 与 CargoTrack2D 见运输区</text>
