      <text x="169" y="212" font-size="19" font-weight="700">TowerSlice.tscn</text>
      <text x="344" y="212" fill="#435D55" font-size="18">保存塔台与两桥碰撞、镜面与接光盘，以及实体货车、交付站和会话覆盖层</text>
    </g>

